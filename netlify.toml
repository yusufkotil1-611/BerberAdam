# Netlify yapılandırması. Next.js için ek ayar gerekmez: Netlify adaptörü otomatik kurar.
[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # Netlify'ın "gizli anahtar taraması", genel adres (alan adı) gibi gizli olmayan değerleri
  # derleme çıktısında bulup derlemeyi yanlışlıkla durdurmasın.
  SECRETS_SCAN_OMIT_KEYS = "PUBLIC_URL,ADMIN_HOST,NEXT_PUBLIC_SITE_URL"
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"
